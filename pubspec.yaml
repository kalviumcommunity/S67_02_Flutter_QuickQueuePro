name: vendorcodesimwork
description: "QuickQueue Pro - Street food vendor order management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7

  # State Management
  provider: ^6.1.4

  # Utilities
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_tts: ^4.2.1
  google_fonts: ^6.2.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
